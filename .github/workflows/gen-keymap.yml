name: Generate Keymap SVG

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install keymap-drawer
        run: pipx install keymap-drawer
      - name: Parse keymap
        run: keymap parse -c 10 -z config/sweep.keymap >sweep_keymap.yaml
      - name: Draw keymap
        run: |
          keymap draw --zmk-keyboard cradio sweep_keymap.yaml >images/sweep-keymap.svg
      - name: Commit & push if svg changed
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add images/sweep-keymap.svg
            if ! git diff --cached --quiet -- images/sweep-keymap.svg; then
              git commit -m "feat: regen keymap"
              git push
            fi
